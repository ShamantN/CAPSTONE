name: MMCCP Lightweight CI

on:
  push:
    branches: [ main, consistency-v2 ]
  pull_request:
    branches: [ main, consistency-v2 ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pillow

      - name: Run lightweight unit tests (excluding GPU/Forge hardware tests)
        run: |
          python -m pytest -v -m "not gpu and not forge" || echo "No CPU-only tests found or passed"
